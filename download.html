<!DOCTYPE html>
<html>
<head>
  <title>Download Extension</title>
</head>
<body>
  <p id="message">Your download is starting...</p>

  <script>
    window.onload = () => {
      const link = document.createElement("a");
      link.href = "./magister-pack-opener_V1_8_12.zip";
      link.download = "magister-pack-opener.zip";
      document.body.appendChild(link);
      link.click();
      link.remove();

      document.getElementById("message").textContent =
        "Download started — you can close this tab.";
    };
  </script>
</body>
</html>
