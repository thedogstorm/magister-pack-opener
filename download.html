<!DOCTYPE html>
<html>
<head>
  <title>Download Extension</title>
</head>
<body>
  <p>Your download should start automatically.</p>

  <script>
    window.onload = () => {
      const link = document.createElement("a");
      link.href = "./latest.zip";
      link.download = "magister-pack-opener.zip";
      link.click();
    };
  </script>
</body>
</html>
